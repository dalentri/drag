[project]
name = "drag"
version = "0.1.0"
description = "An Evaluated RAG Document Search API written in Python."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi[standard]>=0.143.1",
  "langchain-community>=0.3.31",
  "langchain-google-vertexai>=3.2.4",
  "llama-index>=0.14.25",
  "llama-index-embeddings-huggingface>=0.8.0",
  "llama-index-llms-ollama>=0.11.0",
  "llama-index-vector-stores-postgres>=0.9.0",
  "psycopg2-binary>=2.9.13",
  "pydantic-settings>=2.16.0",
  "pytest>=9.1.1",
  "pytest-mock>=3.17.0",
  "python-dotenv>=1.2.4",
  "ragas<0.4",
  "uvicorn>=0.54.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
